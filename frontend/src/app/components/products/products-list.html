<section class="products-panel">
  <div class="form-card">
    <h2>Novo produto</h2>

    <form class="product-form" (ngSubmit)="submitProduct()">
      <label>
        <span>Nome</span>
        <input type="text" [(ngModel)]="newProduct.name" name="name" placeholder="Ex.: Mouse sem fio" />
      </label>

      <label>
        <span>Preço</span>
        <input type="number" min="0" step="0.01" [(ngModel)]="newProduct.price" name="price" />
      </label>

      <label class="checkbox-row">
        <input type="checkbox" [(ngModel)]="newProduct.isActive" name="isActive" />
        <span>Produto ativo</span>
      </label>

      <div class="action-row">
        <button type="submit">{{ editingProductId !== null ? 'Salvar produto' : 'Cadastrar' }}</button>
        <button type="button" class="secondary" *ngIf="editingProductId !== null" (click)="cancelEditProduct()">Cancelar</button>
      </div>
    </form>

    <p class="message" *ngIf="message()">{{ message() }}</p>
  </div>

  <div class="list-card">
    <div class="list-header">
      <h2>Produtos</h2>
      <span>{{ products().length }} itens</span>
    </div>

    <div *ngIf="loading()" class="empty-state">Carregando produtos...</div>

    <ul class="product-list" *ngIf="!loading()">
      <li *ngFor="let product of products()">
        <div>
          <strong>{{ product.name }}</strong>
          <small>R$ {{ product.price | number: '1.2-2' }}</small>
        </div>

        <div class="status-group">
          <span class="tag" [class.inactive]="!product.isActive">
            {{ product.isActive ? 'Ativo' : 'Inativo' }}
          </span>
          <button type="button" class="mini" (click)="startEditProduct(product)">Editar</button>
          <button type="button" class="mini" (click)="toggleStatus(product)">
            {{ product.isActive ? 'Desativar' : 'Ativar' }}
          </button>
        </div>
      </li>
    </ul>

    <div class="empty-state" *ngIf="!loading() && products().length === 0">
      Nenhum produto cadastrado.
    </div>
  </div>
</section>
